  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-50 text-gray-800 font-sans">
  <header class="max-w-6xl mx-auto p-4 flex justify-between items-center bg-white shadow-sm rounded-b">
    <div id="brand-logo" class="font-bold text-xl text-red-600">PEPPER MOTORS</div>
    <a id="header-phone" href="tel:+79999999999" class="font-semibold text-gray-700">+7 (999) 999-99-99</a>
  </header>

  <section class="max-w-6xl mx-auto mt-6 p-4">
    <div class="bg-slate-900 text-white rounded-2xl p-8 min-h-[300px] flex flex-col justify-center items-start">
      <span id="slider-tag" class="bg-red-600 text-xs px-3 py-1 rounded-full uppercase tracking-wider mb-2">Акция</span>
      <h1 id="slider-title" class="text-3xl md:text-5xl font-bold mb-4">Подбор авто под ваш бюджет</h1>
      <p id="slider-desc" class="text-gray-300 max-w-xl mb-6">Рассчитаем стоимость и предложим варианты за 15 минут.</p>
      <button onclick="openQuiz()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl transition">
        Рассчитать стоимость
      </button>
    </div>
  </section>

  <div id="quiz-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
      <button onclick="closeQuiz()" class="absolute top-4 right-4 text-gray-400">✕</button>
      <div class="w-full bg-gray-200 h-2 rounded-full mb-6 overflow-hidden">
        <div id="quiz-progress" class="bg-red-600 h-full w-1/3 transition-all duration-300"></div>
      </div>
      <div id="quiz-step-container"></div>
    </div>
  </div>

  <script>
    const sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
    const urlParams = new URLSearchParams(window.location.search);
    const utmContent = urlParams.get('utm_content');
    const utmCampaign = urlParams.get('utm_campaign');
    const matchKey = utmContent || utmCampaign;

    // Функция получения ClientID из Яндекс Метрики
    function getYmUid() {
      // 1. Попытка получить ClientID прямо из API Яндекс Метрики
      if (typeof ym === 'function') {
        let ymId = null;
        try {
          ym(112791859, 'getClientID', (id) => { ymId = id; });
          if (ymId) return ymId;
        } catch (e) {}
      }
      // 2. Считывание ClientID из куки _ym_uid
      const match = document.cookie.match(/(?:^|; )_ym_uid=([^;]*)/);
      if (match) return match[1];

      // 3. Резервный поиск из URL-параметров (click_id / yclid / ym_uid)
      return urlParams.get('click_id') || urlParams.get('yclid') || urlParams.get('ym_uid') || null;
    }

    // Реестр фоллбэк-баннеров (п. 4.3 ТЗ)
    const bannerRegistry = {
      'china': { title: 'Авто из Китая под ключ', desc: 'Прямой перевод через ВТБ. В наличии на границе.', tag: 'Китай' },
      'europe': { title: 'Дизель из Европы', desc: 'Европейское качество с гарантией истории.', tag: 'Европа' },
      'china_hybrid': { title: 'Авто из Китая под ключ', desc: 'Прямой перевод через ВТБ. В наличии на границе.', tag: 'Китай' },
      'europe_diesel': { title: 'Дизель из Европы', desc: 'Европейское качество с гарантией истории.', tag: 'Европа' }
    };

    // Загрузка динамического конфига из админки и подмена баннеров по UTM
    fetch('/api/config').then(r => r.json()).then(cfg => {
      if (cfg.brandName) document.getElementById('brand-logo').innerText = cfg.brandName;
      if (cfg.phone) {
        document.getElementById('header-phone').innerText = cfg.phone;
        document.getElementById('header-phone').href = 'tel:' + cfg.phone.replace(/\D/g, '');
      }

      const banners = cfg.banners || [];
      const matchedBanner = banners.find(b => b.utm === matchKey);

      if (matchedBanner) {
        document.getElementById('slider-title').innerText = matchedBanner.title;
        document.getElementById('slider-desc').innerText = matchedBanner.title;
        document.getElementById('slider-tag').innerText = matchedBanner.utm || 'Акция';
      } else if (bannerRegistry[matchKey]) {
        document.getElementById('slider-title').innerText = bannerRegistry[matchKey].title;
        document.getElementById('slider-desc').innerText = bannerRegistry[matchKey].desc;
        document.getElementById('slider-tag').innerText = bannerRegistry[matchKey].tag;
      }
    });

    // Дерево вопросов с ветвлением (п. 4.1 ТЗ)
    const quizTree = {
      step1: {
        question: "Какое авто вас интересует?",
        options: [
          { label: "Из Китая", next: "step_china" },
          { label: "Из Европы", next: "step_europe" }
        ]
      },
      step_china: {
        question: "Какая система оплаты вас интересует?",
        options: [
          { label: "Прямой перевод через ВТБ", next: "final" },
          { label: "Оплата при получении", next: "final" }
        ]
      },
      step_europe: {
        question: "Какой тип двигателя предпочитаете?",
        options: [
          { label: "Дизель из Европы", next: "final" },
          { label: "Бензин", next: "final" }
        ]
      }
    };

    let currentStepKey = 'step1';
    let answers = {};

    function openQuiz() {
      document.getElementById('quiz-modal').classList.replace('hidden', 'flex');
      renderStep();
    }

    function closeQuiz() {
      document.getElementById('quiz-modal').classList.replace('flex', 'hidden');
    }

    // Фоновая фиксация частичного прохождения квиза (п. 5.6 ТЗ)
    function trackStep(stepKey, answerValue) {
      try {
        fetch('/api/analytics/step', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            step: stepKey,
            answer: answerValue,
            utm: window.location.search
          })
        });
      } catch (e) { console.error('Ошибка аналитики:', e); }
    }

    function saveAns(stepKey, question, answerValue, nextKey) {
      answers[question] = answerValue;
      trackStep(stepKey, answerValue);

      currentStepKey = nextKey;
      renderStep();
    }

    function renderStep() {
      const container = document.getElementById('quiz-step-container');

      if (currentStepKey !== 'final') {
        const step = quizTree[currentStepKey];
        const progressPercent = currentStepKey === 'step1' ? 33 : 66;
        document.getElementById('quiz-progress').style.width = `${progressPercent}%`;

        container.innerHTML = `
          <h3 class="text-xl font-bold mb-4">${step.question}</h3>
          <div class="space-y-3">
            ${step.options.map(o => `
              <button onclick="saveAns('${currentStepKey}', '${step.question}', '${o.label}', '${o.next}')" 
                      class="w-full text-left p-4 rounded-xl border hover:border-red-600 transition">
                ${o.label}
              </button>
            `).join('')}
          </div>
        `;
      } else {
        document.getElementById('quiz-progress').style.width = '100%';
        container.innerHTML = `
          <h3 class="text-xl font-bold mb-4">Заполните данные для расчета</h3>
          <form onsubmit="submitLead(event)" class="space-y-4">
            <input type="text" id="u-name" placeholder="Ваше имя" required class="w-full p-3 border rounded-xl" />
            <div>
              <input type="text" id="u-phone" placeholder="+7 (___) ___-__-__" required class="w-full p-3 border rounded-xl" />
              <p id="phone-err" class="text-red-500 text-xs mt-1 hidden">Нужно 11 цифр номера</p>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <label class="border p-2 rounded text-center cursor-pointer text-sm"><input type="radio" name="ch" value="Telegram" required /> Telegram</label>
              <label class="border p-2 rounded text-center cursor-pointer text-sm"><input type="radio" name="ch" value="MAX" /> MAX</label>
              <label class="border p-2 rounded text-center cursor-pointer text-sm"><input type="radio" name="ch" value="SMS" /> SMS</label>
            </div>
            <div class="text-xs text-gray-600 flex gap-2"><input type="checkbox" required /> Согласен на обработку ПД (152-ФЗ)</div>
            <input type="text" id="hp" class="hidden" />
            <button type="submit" id="s-btn" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Получить расчет</button>
          </form>
        `;
        IMask(document.getElementById('u-phone'), { mask: '+{7} (000) 000-00-00' });
      }
    }

    async function submitLead(e) {
      e.preventDefault();
      if (document.getElementById('hp').value !== '') return;
      const phone = document.getElementById('u-phone').value.replace(/\D/g, '');
      if (phone.length !== 11) return document.getElementById('phone-err').classList.remove('hidden');

      document.getElementById('s-btn').disabled = true;

      // Сбор идентификаторов и отправка заявки
      const ymUid = getYmUid();

      const res = await fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('u-name').value,
          phone,
          channel: document.querySelector('input[name="ch"]:checked').value,
          answers,
          utm: { 
            utm_source: urlParams.get('utm_source') || 'direct', 
            utm_campaign: utmCampaign || 'none',
            utm_content: utmContent || 'none',
            click_id: urlParams.get('click_id') || urlParams.get('yclid') || null,
            ym_uid: ymUid // <--- Автоматически передает ClientID Метрики
          }
        })
      });

      if (res.ok) {
        document.getElementById('quiz-step-container').innerHTML = `<h3 class="text-2xl font-bold text-green-600 text-center py-8">Заявка принята!</h3>`;
      }
    }
  </script>
</body>
</html>
