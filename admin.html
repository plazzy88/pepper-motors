<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — Pepper Motors</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Управление контентом сайта</h1>
    <form id="admin-form" onsubmit="saveConfig(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Название бренда:</label>
        <input type="text" id="brandName" class="w-full p-2 border rounded" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Телефон в шапке:</label>
        <input type="text" id="phone" class="w-full p-2 border rounded" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Заголовок по умолчанию:</label>
        <input type="text" id="mainTitle" class="w-full p-2 border rounded" required />
      </div>
      <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-6 rounded hover:bg-blue-700">
        Сохранить изменения
      </button>
      <span id="save-status" class="text-green-600 text-sm ml-4 hidden">Сохранено!</span>
    </form>
  </div>
  <script>
    async function loadConfig() {
      const res = await fetch('/api/config');
      const data = await res.json();
      document.getElementById('brandName').value = data.brandName;
      document.getElementById('phone').value = data.phone;
      document.getElementById('mainTitle').value = data.mainTitle;
    }
    async function saveConfig(e) {
      e.preventDefault();
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          brandName: document.getElementById('brandName').value,
          phone: document.getElementById('phone').value,
          mainTitle: document.getElementById('mainTitle').value
        })
      });
      const status = document.getElementById('save-status');
      status.classList.remove('hidden');
      setTimeout(() => status.classList.add('hidden'), 2000);
    }
    loadConfig();
  </script>
</body>
</html>
